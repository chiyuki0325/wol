<!DOCTYPE html>
<html>
  <head>
    <title>Wake On LAN</title>
    <meta name="darkreader-lock" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>
    <div id="main">
      <img
        src="/res/wol.png"
        alt="WOL"
        style="width: 300px; height: auto"
        id="wol-img"
      />
      <input
        type="button"
        value="原神，启动！"
        id="wol-button"
        class="fluent-button fluent-button-primary"
      />
    </div>
    <div id="launch" style="display: none">
      <img
        src="/res/launch.png"
        alt="Launch"
        id="launch-img"
        style="display: none"
      />
    </div>
    <style>
      body {
        background-color: #f0f0f0;
        margin: 0;
        padding: 0;
      }
      #main {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
      }
      #launch {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        background-color: white;
        opacity: 0;
      }
      #launch-img {
        width: 100%;
        transition: opacity 1s ease-in-out;
        opacity: 0;
      }
      @media (prefers-color-scheme: dark) {
        #wol-img {
          filter: invert(1) hue-rotate(180deg) saturate(1);
        }
        body {
          background-color: #121212;
        }
        #launch {
          background-color: black;
        }
        #launch-img {
          filter: invert(1) hue-rotate(180deg) saturate(1);
        }
      }

      /* Reduced CSS variables to only what's needed for the buttons */
      * {
        --borderRadiusMedium: 4px;
        --fontSizeBase300: 14px;
        --fontWeightSemibold: 600;
        --lineHeightBase300: 20px;
        --spacingHorizontalM: 12px;
        --durationFaster: 100ms;
        --curveEasyEase: cubic-bezier(0.33, 0, 0.67, 1);
        --colorNeutralForegroundOnBrand: #ffffff;
        --colorBrandBackground: #0f6cbd;
        --colorBrandBackgroundHover: #115ea3;
        --colorBrandBackgroundPressed: #0c3b5e;
        --colorNeutralBackground1: #ffffff;
        --colorNeutralBackground1Hover: #f5f5f5;
        --colorNeutralBackground1Pressed: #e0e0e0;
        --colorNeutralForeground1: #242424;
        --colorNeutralForeground1Hover: #242424;
        --colorNeutralForeground1Pressed: #242424;
        --colorNeutralStroke1: #d1d1d1;
        --colorNeutralStroke1Hover: #c7c7c7;
        --colorNeutralStroke1Pressed: #b3b3b3;
        --strokeWidthThin: 1px;
      }

      .fluent-button {
        -moz-box-align: center;
        align-items: center;
        box-sizing: border-box;
        display: inline-flex;
        -moz-box-pack: center;
        justify-content: center;
        text-decoration-line: none;
        vertical-align: middle;
        margin: 0px;
        overflow: hidden;
        border: var(--strokeWidthThin) solid;
        border-color: var(--colorNeutralStroke1);
        outline-style: none;
        padding: 5px var(--spacingHorizontalM);
        min-width: 96px;
        border-radius: var(--borderRadiusMedium);
        font-size: var(--fontSizeBase300);
        font-weight: var(--fontWeightSemibold);
        line-height: var(--lineHeightBase300);
        transition-duration: var(--durationFaster);
        transition-property: background-color, border-color, color;
        transition-timing-function: var(--curveEasyEase);
      }

      .fluent-button:hover {
        cursor: pointer;
      }

      .fluent-button:hover:active {
        outline-style: none;
      }

      .fluent-button:focus {
        outline-style: none;
      }

      .fluent-button:focus-visible {
        outline-style: none;
      }

      .fluent-button-primary {
        color: var(--colorNeutralForegroundOnBrand);
        background-color: var(--colorBrandBackground);
        border-color: transparent;
      }

      .fluent-button-primary:hover {
        background-color: var(--colorBrandBackgroundHover);
        border-color: transparent;
        color: var(--colorNeutralForegroundOnBrand);
      }

      .fluent-button-primary:hover:active {
        background-color: var(--colorBrandBackgroundPressed);
        border-color: transparent;
        color: var(--colorNeutralForegroundOnBrand);
      }

      .fluent-button-secondary {
        background-color: var(--colorNeutralBackground1);
        color: var(--colorNeutralForeground1);
      }

      .fluent-button-secondary:hover {
        background-color: var(--colorNeutralBackground1Hover);
        border-color: var(--colorNeutralStroke1Hover);
        color: var(--colorNeutralForeground1Hover);
      }

      .fluent-button-secondary:hover:active {
        background-color: var(--colorNeutralBackground1Pressed);
        border-color: var(--colorNeutralStroke1Pressed);
        color: var(--colorNeutralForeground1Pressed);
        outline-style: none;
      }
    </style>
    <script>
      const btn = document.getElementById("wol-button")
      const sha256 = (str) => {
        const buffer = new TextEncoder("utf-8").encode(str)
        return crypto.subtle.digest("SHA-256", buffer).then((hash) => {
          const byteArray = new Uint8Array(hash)
          return Array.from(byteArray)
            .map((byte) => ("0" + byte.toString(16)).slice(-2))
            .join("")
        })
      }
      btn.addEventListener("click", () => {
        btn.disabled = true
        btn.classList.remove("fluent-button-primary")
        btn.classList.add("fluent-button-secondary")
        btn.value = "启动中..."
	const timestamp = String(Math.floor(new Date().getTime() / 100000))
	console.log(timestamp)
        sha256(timestamp).then((hash) => {
          fetch("/wol-trigger", {
            method: "POST",
            body: hash,
          }).then((response) => {
            if (response.ok) {
              launch()
            } else {
              alert("原神启动失败！")
            }
          })
        })
      })

      launch = () => {
        document.getElementById("main").style.display = "none"
        document.getElementById("launch").style.display = "flex"
        document.getElementById("launch-img").style.display = "block"
        setTimeout(() => {
          document.getElementById("launch").style.opacity = 1
          document.getElementById("launch-img").style.opacity = 1
        }, 100)
      }
    </script>
  </body>
</html>
